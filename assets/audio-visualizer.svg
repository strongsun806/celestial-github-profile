<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 130" width="100%" height="100%">
  <defs>
    <!-- Card Background Gradient -->
    <linearGradient id="audioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a1024"/>
    </linearGradient>

    <!-- Glowing Equalizer Gradient -->
    <linearGradient id="eqGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; }
    .pulse-disc { transform-origin: 65px 65px; animation: discSpin 10s linear infinite; }
    .rec-dot { animation: dotBlink 1.2s ease-in-out infinite alternate; }

    /* Equalizer Bars Animations with various timing */
    .b1  { animation: bounce 1.1s ease-in-out infinite alternate; }
    .b2  { animation: bounce 0.8s ease-in-out 0.2s infinite alternate; }
    .b3  { animation: bounce 1.4s ease-in-out 0.1s infinite alternate; }
    .b4  { animation: bounce 0.9s ease-in-out 0.4s infinite alternate; }
    .b5  { animation: bounce 1.3s ease-in-out 0.2s infinite alternate; }
    .b6  { animation: bounce 0.7s ease-in-out 0.5s infinite alternate; }
    .b7  { animation: bounce 1.2s ease-in-out 0.3s infinite alternate; }
    .b8  { animation: bounce 1.5s ease-in-out 0.1s infinite alternate; }
    .b9  { animation: bounce 0.8s ease-in-out 0.4s infinite alternate; }
    .b10 { animation: bounce 1.3s ease-in-out 0.2s infinite alternate; }
    .b11 { animation: bounce 1.0s ease-in-out 0.3s infinite alternate; }
    .b12 { animation: bounce 0.6s ease-in-out 0.6s infinite alternate; }
    .b13 { animation: bounce 1.4s ease-in-out 0.1s infinite alternate; }
    .b14 { animation: bounce 1.1s ease-in-out 0.3s infinite alternate; }
    .b15 { animation: bounce 0.8s ease-in-out 0.5s infinite alternate; }
    .b16 { animation: bounce 1.2s ease-in-out 0.2s infinite alternate; }

    @keyframes discSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes dotBlink { 0% { opacity: 0.2; } 100% { opacity: 1; } }
    @keyframes bounce {
      0%   { height: 10px; y: 92px; }
      100% { height: 64px; y: 38px; }
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="676" height="126" rx="14" fill="url(#audioBg)" stroke="#1e293b" stroke-width="1.8"/>
  <rect x="6" y="6" width="668" height="118" rx="10" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="6 4" opacity="0.3"/>

  <!-- Left: Rotating Vinyl Record / Celestial Audio Disc -->
  <g transform="translate(15, 0)">
    <g class="pulse-disc">
      <circle cx="65" cy="65" r="44" fill="#030712" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="65" cy="65" r="36" fill="none" stroke="#1e293b" stroke-width="1"/>
      <circle cx="65" cy="65" r="28" fill="none" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3"/>
      <circle cx="65" cy="65" r="20" fill="none" stroke="#1e293b" stroke-width="1"/>
      <!-- Core Label -->
      <circle cx="65" cy="65" r="14" fill="#6366f1" filter="url(#neonGlow)"/>
      <circle cx="65" cy="65" r="4" fill="#ffffff"/>
      <!-- Optical Sheen -->
      <path d="M 65,21 A 44,44 0 0,1 104,85 L 65,65 Z" fill="#ffffff" opacity="0.06"/>
      <path d="M 65,109 A 44,44 0 0,1 26,45 L 65,65 Z" fill="#ffffff" opacity="0.06"/>
    </g>
  </g>

  <!-- Center-Left: Track Info & Telemetry -->
  <g transform="translate(150, 24)">
    <circle cx="6" cy="6" r="4.5" fill="#10b981" class="rec-dot"/>
    <text x="18" y="10" class="mono" font-size="11" font-weight="700" fill="#10b981" letter-spacing="1">NOW STREAMING // FOCUS FREQUENCY</text>
    
    <text x="6" y="36" class="mono" font-size="15" font-weight="800" fill="#f8fafc">Celestial Synthwave &amp; Ambient Flow</text>
    <text x="6" y="56" class="mono" font-size="11" fill="#94a3b8">BPM: 110 • TUNING: 432 Hz • MODE: DEEP CODING IMMERSION</text>

    <!-- Progress Line -->
    <line x1="6" y1="74" x2="260" y2="74" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <line x1="6" y1="74" x2="185" y2="74" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)"/>
    <circle cx="185" cy="74" r="4.5" fill="#ffffff"/>
    <text x="272" y="77" class="mono" font-size="9.5" fill="#64748b">38:42 / 60:00</text>
  </g>

  <!-- Right: 16-Band Dynamic Equalizer Bars -->
  <g transform="translate(485, 0)">
    <!-- Equalizer Grid Background -->
    <rect x="-8" y="24" width="186" height="84" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
    
    <!-- 16 Bars -->
    <rect x="0"   y="48" width="6" height="54" rx="2" fill="url(#eqGrad)" class="b1"/>
    <rect x="10"  y="48" width="6" height="54" rx="2" fill="url(#eqGrad)" class="b2"/>
    <rect x="20"  y="48" width="6" height="54" rx="2" fill="url(#eqGrad)" class="b3"/>
    <rect x="30"  y="48" width="6" height="54" rx="2" fill="url(#eqGrad)" class="b4"/>
    <rect x="40"  y="48" width="6" height="54" rx="2" fill="url(#eqGrad)" class="b5"/>
    <rect x="50"  y="48" width="6" height="54" rx="2" fill="url(#eqGrad)" class="b6"/>
    <rect x="60"  y="48" width="6" height="54" rx="2" fill="url(#eqGrad)" class="b7"/>
    <rect x="70"  y="48" width="6" height="54" rx="2" fill="url(#eqGrad)" class="b8"/>
    <rect x="80"  y="48" width="6" height="54" rx="2" fill="url(#eqGrad)" class="b9"/>
    <rect x="90"  y="48" width="6" height="54" rx="2" fill="url(#eqGrad)" class="b10"/>
    <rect x="100" y="48" width="6" height="54" rx="2" fill="url(#eqGrad)" class="b11"/>
    <rect x="110" y="48" width="6" height="54" rx="2" fill="url(#eqGrad)" class="b12"/>
    <rect x="120" y="48" width="6" height="54" rx="2" fill="url(#eqGrad)" class="b13"/>
    <rect x="130" y="48" width="6" height="54" rx="2" fill="url(#eqGrad)" class="b14"/>
    <rect x="140" y="48" width="6" height="54" rx="2" fill="url(#eqGrad)" class="b15"/>
    <rect x="150" y="48" width="6" height="54" rx="2" fill="url(#eqGrad)" class="b16"/>
  </g>
</svg>