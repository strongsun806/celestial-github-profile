<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080e1e"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="neonPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="neonAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Radar Sweep Gradient -->
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="80%" stop-color="#0284c7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; }
    .hud-title { font-size: 11px; font-weight: 700; fill: #94a3b8; letter-spacing: 1.5px; }
    .hud-sub { font-size: 9.5px; fill: #64748b; }
    .hud-val { font-size: 12px; font-weight: 700; fill: #38bdf8; }
    .hud-green { fill: #34d399; }
    .hud-amber { fill: #fbbf24; }

    /* Animations */
    .rec-blink { animation: recPulse 1.4s ease-in-out infinite alternate; }
    .tesseract-spin { transform-origin: 140px 135px; animation: spinTess 14s linear infinite; }
    .tesseract-inner { transform-origin: 140px 135px; animation: spinTessRev 10s linear infinite; }
    .radar-sweep { transform-origin: 820px 135px; animation: radarRot 5s linear infinite; }
    .wave-shift1 { animation: waveSlide 4s linear infinite; }
    .wave-shift2 { animation: waveSlideRev 6s linear infinite; }
    .eq-bar1 { animation: eqJump 1.2s ease-in-out infinite alternate; }
    .eq-bar2 { animation: eqJump 0.9s ease-in-out 0.2s infinite alternate; }
    .eq-bar3 { animation: eqJump 1.5s ease-in-out 0.4s infinite alternate; }
    .eq-bar4 { animation: eqJump 1.1s ease-in-out 0.1s infinite alternate; }
    .eq-bar5 { animation: eqJump 1.4s ease-in-out 0.3s infinite alternate; }
    .eq-bar6 { animation: eqJump 0.8s ease-in-out 0.5s infinite alternate; }

    @keyframes recPulse { 0% { opacity: 0.2; } 100% { opacity: 1; } }
    @keyframes spinTess { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinTessRev { from { transform: rotate(360deg) scale(0.92); } to { transform: rotate(0deg) scale(0.92); } }
    @keyframes radarRot { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes waveSlide { 0% { transform: translateX(0); } 100% { transform: translateX(-80px); } }
    @keyframes waveSlideRev { 0% { transform: translateX(-80px); } 100% { transform: translateX(0); } }
    @keyframes eqJump { 0% { transform: scaleY(0.3); } 100% { transform: scaleY(1.15); } }
  </style>

  <!-- Outer Lab Chassis Panel -->
  <rect x="5" y="5" width="950" height="240" rx="14" fill="url(#hudBg)" stroke="#1e293b" stroke-width="2"/>
  <rect x="9" y="9" width="942" height="232" rx="10" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="8 6" opacity="0.4"/>

  <!-- Top Lab HUD Navigation Bar -->
  <g transform="translate(25, 26)">
    <circle cx="6" cy="4" r="4.5" fill="#ef4444" class="rec-blink"/>
    <text x="18" y="8" class="mono hud-title" fill="#f43f5e">LIVE LAB TELEMETRY</text>
    <text x="180" y="8" class="mono hud-sub">// RIG: KHG-CELESTIAL-R&amp;D-806</text>
    <text x="440" y="8" class="mono hud-sub">CORE ENGINE: WebGL2 / GLSL 3.0 / Three.js</text>
    <text x="760" y="8" class="mono" font-size="10" fill="#38bdf8">SYS: 60.0 FPS [STABLE]</text>
  </g>

  <!-- Section Dividers -->
  <line x1="290" y1="38" x2="290" y2="230" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="680" y1="38" x2="680" y2="230" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ==================== LEFT MODULE: 4D TESSERACT HYPERCUBE ==================== -->
  <g transform="translate(25, 48)">
    <text x="10" y="10" class="mono hud-title">MODULE 01: 4D HYPERCUBE</text>
    <text x="10" y="24" class="mono hud-sub">SO(4) Real-Time Stereographic Projection</text>

    <!-- Outer Frame Box -->
    <rect x="0" y="32" width="240" height="136" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1.2"/>
    
    <!-- Background Grid in Module -->
    <line x1="30" y1="100" x2="210" y2="100" stroke="#0f172a" stroke-width="1"/>
    <line x1="120" y1="45" x2="120" y2="155" stroke="#0f172a" stroke-width="1"/>
    <circle cx="120" cy="100" r="48" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- 4D Hypercube Projection (Wireframe) -->
    <!-- Outer Cube -->
    <g class="tesseract-spin" style="transform-origin: 120px 100px;">
      <polygon points="80,60 160,60 160,140 80,140" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.85"/>
      <circle cx="80" cy="60" r="2.5" fill="#38bdf8"/>
      <circle cx="160" cy="60" r="2.5" fill="#38bdf8"/>
      <circle cx="160" cy="140" r="2.5" fill="#38bdf8"/>
      <circle cx="80" cy="140" r="2.5" fill="#38bdf8"/>
    </g>

    <!-- Inner Cube & Connecting 4D Projection Lines -->
    <g class="tesseract-inner" style="transform-origin: 120px 100px;">
      <polygon points="98,78 142,78 142,122 98,122" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-width="1.5" filter="url(#neonPurple)"/>
      <line x1="80" y1="60" x2="98" y2="78" stroke="#38bdf8" stroke-width="1" opacity="0.75"/>
      <line x1="160" y1="60" x2="142" y2="78" stroke="#38bdf8" stroke-width="1" opacity="0.75"/>
      <line x1="160" y1="140" x2="142" y2="122" stroke="#38bdf8" stroke-width="1" opacity="0.75"/>
      <line x1="80" y1="140" x2="98" y2="122" stroke="#38bdf8" stroke-width="1" opacity="0.75"/>
      <circle cx="120" cy="100" r="3" fill="#ffffff" filter="url(#neonCyan)"/>
    </g>

    <text x="10" y="160" class="mono hud-sub">ROT-W: 0.04 rad/f | VERTICES: 16 | EDGES: 32</text>
  </g>

  <!-- ==================== CENTER MODULE: SHADER OSCILLOSCOPE & SPECTRUM ==================== -->
  <g transform="translate(315, 48)">
    <text x="10" y="10" class="mono hud-title">MODULE 02: SHADER WAVEFORM &amp; LENSING</text>
    <text x="10" y="24" class="mono hud-sub">Raymarched Spacetime Gravitational Curvature</text>

    <!-- Screen Box -->
    <rect x="0" y="32" width="340" height="136" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Oscilloscope Grid -->
    <g opacity="0.25">
      <line x1="15" y1="65" x2="325" y2="65" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="2 3"/>
      <line x1="15" y1="100" x2="325" y2="100" stroke="#38bdf8" stroke-width="1"/>
      <line x1="15" y1="135" x2="325" y2="135" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="2 3"/>
      <line x1="80" y1="40" x2="80" y2="160" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="2 3"/>
      <line x1="170" y1="40" x2="170" y2="160" stroke="#38bdf8" stroke-width="1"/>
      <line x1="260" y1="40" x2="260" y2="160" stroke="#38bdf8" stroke-width="0.7" stroke-dasharray="2 3"/>
    </g>

    <!-- Waveform Clipping Path -->
    <clipPath id="scopeClip">
      <rect x="5" y="35" width="330" height="130"/>
    </clipPath>

    <!-- Dynamic Waveforms -->
    <g clip-path="url(#scopeClip)">
      <!-- Wave 1: Primary Harmonics -->
      <path d="M -40,100 Q 0,60 40,100 T 120,100 T 200,100 T 280,100 T 360,100 T 440,100" fill="none" stroke="#38bdf8" stroke-width="2.2" class="wave-shift1" filter="url(#neonCyan)"/>
      <!-- Wave 2: Secondary Resonance -->
      <path d="M -40,100 Q 20,130 60,100 T 140,100 T 220,100 T 300,100 T 380,100 T 460,100" fill="none" stroke="#fbbf24" stroke-width="1.4" opacity="0.8" class="wave-shift2"/>
    </g>

    <!-- Mini Frequency Spectrum Bars in Bottom-Right of Center Box -->
    <g transform="translate(230, 142)">
      <rect x="0" y="-20" width="4" height="20" fill="#38bdf8" class="eq-bar1" style="transform-origin: 0px 0px;"/>
      <rect x="7" y="-20" width="4" height="20" fill="#60a5fa" class="eq-bar2" style="transform-origin: 7px 0px;"/>
      <rect x="14" y="-20" width="4" height="20" fill="#818cf8" class="eq-bar3" style="transform-origin: 14px 0px;"/>
      <rect x="21" y="-20" width="4" height="20" fill="#c084fc" class="eq-bar4" style="transform-origin: 21px 0px;"/>
      <rect x="28" y="-20" width="4" height="20" fill="#34d399" class="eq-bar5" style="transform-origin: 28px 0px;"/>
      <rect x="35" y="-20" width="4" height="20" fill="#fbbf24" class="eq-bar6" style="transform-origin: 35px 0px;"/>
      <text x="-48" y="-4" class="mono hud-sub" font-size="8.5">GLSL FFT</text>
    </g>

    <text x="10" y="160" class="mono hud-sub">STEP: 128 SAMPLES | SCHWARZSCHILD RADIUS: 2.95 GM/c²</text>
  </g>

  <!-- ==================== RIGHT MODULE: CELESTIAL RADAR & METRICS ==================== -->
  <g transform="translate(695, 48)">
    <text x="10" y="10" class="mono hud-title">MODULE 03: SPATIAL TELEMETRY</text>
    <text x="10" y="24" class="mono hud-sub">Real-Time Sensor &amp; Node Coordinates</text>

    <!-- Radar Box -->
    <rect x="0" y="32" width="240" height="136" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Radar Display Circle -->
    <g transform="translate(14, 40)">
      <circle cx="56" cy="56" r="50" fill="url(#radarGlow)" stroke="#1e293b" stroke-width="1"/>
      <circle cx="56" cy="56" r="34" fill="none" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 2"/>
      <circle cx="56" cy="56" r="18" fill="none" stroke="#334155" stroke-width="0.8"/>
      <line x1="6" y1="56" x2="106" y2="56" stroke="#1e293b" stroke-width="1"/>
      <line x1="56" y1="6" x2="56" y2="106" stroke="#1e293b" stroke-width="1"/>

      <!-- Blips / Target Nodes -->
      <circle cx="78" cy="38" r="2.5" fill="#34d399" filter="url(#neonCyan)"/>
      <circle cx="36" cy="72" r="2" fill="#fbbf24"/>
      <circle cx="84" cy="80" r="3" fill="#38bdf8"/>

      <!-- Radar Rotating Sweep -->
      <g class="radar-sweep" style="transform-origin: 56px 56px;">
        <line x1="56" y1="56" x2="106" y2="56" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
        <path d="M 56,56 L 106,56 A 50,50 0 0,0 95,20 Z" fill="#38bdf8" opacity="0.2"/>
      </g>
    </g>

    <!-- Data Columns on Radar Right -->
    <g transform="translate(132, 48)">
      <text x="0" y="10" class="mono hud-sub">INSTANCED NODES</text>
      <text x="0" y="24" class="mono hud-val">1,400+ <tspan font-size="9" fill="#94a3b8">Active</tspan></text>

      <text x="0" y="44" class="mono hud-sub">DRAW CALLS</text>
      <text x="0" y="58" class="mono hud-val" fill="#34d399">1 Call <tspan font-size="9" fill="#94a3b8">[Batched]</tspan></text>

      <text x="0" y="78" class="mono hud-sub">GPU LATENCY</text>
      <text x="0" y="92" class="mono hud-val" fill="#fbbf24">&lt; 1.2 ms <tspan font-size="9" fill="#94a3b8">Sync</tspan></text>
    </g>

    <text x="10" y="160" class="mono hud-sub">RADAR FOV: 360° | ORBIT ALTITUDE: 42,164 KM</text>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(25, 230)">
    <text x="10" y="0" class="mono" font-size="9.5" fill="#64748b">
      &gt; SPATIAL_CONSOLE::KERNEL_OK // THREAD_WORKER: ACTIVE // CELESTIAL_EPHEMERIS: LOADED // READY FOR USER INTERACTION
    </text>
  </g>
</svg>