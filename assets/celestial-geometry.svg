<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="100%" height="100%">
  <defs>
    <!-- Background Cosmic Glow -->
    <radialGradient id="nebulaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#818cf8" stop-opacity="0.18"/>
      <stop offset="75%" stop-color="#4f46e5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Core Polyhedron Gradients -->
    <linearGradient id="polyTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="polyLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="polyRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="polyBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Drop Shadow / Glow Filter -->
    <filter id="celestialGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .glow-core { animation: pulseGlow 4s ease-in-out infinite alternate; }
    .float-core { animation: celestialFloat 3.8s ease-in-out infinite; }
    .orbit-cw { transform-origin: 110px 110px; animation: spinOrbitCW 24s linear infinite; }
    .orbit-ccw { transform-origin: 110px 110px; animation: spinOrbitCCW 18s linear infinite; }
    .star-twinkle { animation: twinkle 2.4s ease-in-out infinite alternate; }
    .star-twinkle-delay { animation: twinkle 3s ease-in-out 1.2s infinite alternate; }

    @keyframes spinOrbitCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinOrbitCCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    @keyframes celestialFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(2deg); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.7; transform: scale(0.96); }
      100% { opacity: 1; transform: scale(1.04); }
    }
    @keyframes twinkle {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }
  </style>

  <!-- Ambient Cosmic Nebula Glow -->
  <circle cx="110" cy="110" r="95" fill="url(#nebulaGlow)" class="glow-core" style="transform-origin: 110px 110px;"/>

  <!-- Astronomical Coordinate System & Outer Celestial Ring -->
  <circle cx="110" cy="110" r="88" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="3 5" opacity="0.65"/>
  <circle cx="110" cy="110" r="76" fill="none" stroke="#475569" stroke-width="1" opacity="0.5"/>
  <circle cx="110" cy="110" r="102" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="1 8" opacity="0.8"/>

  <!-- Celestial Coordinate Crosshairs & Cardinal Ticks -->
  <line x1="110" y1="12" x2="110" y2="28" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
  <line x1="110" y1="192" x2="110" y2="208" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
  <line x1="12" y1="110" x2="28" y2="110" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
  <line x1="192" y1="110" x2="208" y2="110" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>

  <!-- Diagonal Celestial Rays -->
  <line x1="45" y1="45" x2="55" y2="55" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
  <line x1="175" y1="45" x2="165" y2="55" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
  <line x1="45" y1="175" x2="55" y2="165" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
  <line x1="175" y1="175" x2="165" y2="165" stroke="#818cf8" stroke-width="1" opacity="0.4"/>

  <!-- Rotating Astronomical Orbit 1 (Tilted Ellipse & Moonlet) -->
  <g class="orbit-cw">
    <ellipse cx="110" cy="110" rx="90" ry="34" fill="none" stroke="url(#ringGrad1)" stroke-width="1.8" transform="rotate(-30 110 110)"/>
    <!-- Orbiting Satellite Node 1 -->
    <g transform="rotate(-30 110 110)">
      <circle cx="200" cy="110" r="4.5" fill="#38bdf8" filter="url(#celestialGlow)"/>
      <circle cx="200" cy="110" r="2" fill="#ffffff"/>
      <circle cx="20" cy="110" r="2.5" fill="#c084fc" opacity="0.8"/>
    </g>
  </g>

  <!-- Rotating Astronomical Orbit 2 (Counter-Tilted Ellipse & Golden Celestial Node) -->
  <g class="orbit-ccw">
    <ellipse cx="110" cy="110" rx="84" ry="28" fill="none" stroke="url(#ringGrad2)" stroke-width="1.4" stroke-dasharray="7 4" transform="rotate(45 110 110)"/>
    <!-- Orbiting Satellite Node 2 -->
    <g transform="rotate(45 110 110)">
      <circle cx="26" cy="110" r="3.5" fill="#fbbf24" filter="url(#celestialGlow)"/>
      <circle cx="26" cy="110" r="1.5" fill="#ffffff"/>
      <circle cx="194" cy="110" r="2" fill="#f43f5e" opacity="0.9"/>
    </g>
  </g>

  <!-- Floating Core: 3D Geometric Crystal Polyhedron (Octahedron / Astrometry Diamond Core) -->
  <g class="float-core" transform-origin="110 110">
    <!-- Polyhedron Drop Glow -->
    <polygon points="110,48 152,106 110,126 68,106" fill="#38bdf8" opacity="0.25" filter="url(#celestialGlow)"/>

    <!-- Upper Pyramid Faces -->
    <!-- Front-Left Upper -->
    <polygon points="110,48 68,106 110,124" fill="url(#polyLeft)" stroke="#38bdf8" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Front-Right Upper -->
    <polygon points="110,48 152,106 110,124" fill="url(#polyRight)" stroke="#7dd3fc" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Top Apex Highlight -->
    <polygon points="110,48 94,92 110,102 126,92" fill="url(#polyTop)" opacity="0.85"/>

    <!-- Lower Inverted Pyramid Faces -->
    <!-- Front-Left Lower -->
    <polygon points="68,106 110,172 110,124" fill="url(#polyBottom)" stroke="#6366f1" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Front-Right Lower -->
    <polygon points="152,106 110,172 110,124" fill="#312e81" stroke="#818cf8" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Inner Geometric Wireframe Grid Ticks -->
    <line x1="110" y1="48" x2="110" y2="172" stroke="#bae6fd" stroke-width="1.5" opacity="0.9"/>
    <line x1="68" y1="106" x2="152" y2="106" stroke="#bae6fd" stroke-width="1.5" opacity="0.9"/>
    <circle cx="110" cy="124" r="3.5" fill="#ffffff" filter="url(#celestialGlow)"/>

    <!-- Geometric Horizon Ring around Core -->
    <ellipse cx="110" cy="114" rx="52" ry="12" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.8"/>
  </g>

  <!-- Constellation Stardust & Celestial Diamonds -->
  <!-- Top Left Diamond Star -->
  <g transform="translate(42, 38)" class="star-twinkle">
    <path d="M 0,-7 Q 0,0 7,0 Q 0,0 0,7 Q 0,0 -7,0 Q 0,0 0,-7 Z" fill="#38bdf8"/>
    <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Top Right Diamond Star -->
  <g transform="translate(178, 44)" class="star-twinkle-delay">
    <path d="M 0,-9 Q 0,0 9,0 Q 0,0 0,9 Q 0,0 -9,0 Q 0,0 0,-9 Z" fill="#fbbf24"/>
    <circle cx="0" cy="0" r="2" fill="#ffffff"/>
  </g>

  <!-- Bottom Left Tiny Star -->
  <g transform="translate(36, 158)" class="star-twinkle-delay">
    <path d="M 0,-6 Q 0,0 6,0 Q 0,0 0,6 Q 0,0 -6,0 Q 0,0 0,-6 Z" fill="#c084fc"/>
    <circle cx="0" cy="0" r="1.2" fill="#ffffff"/>
  </g>

  <!-- Bottom Right Diamond Star -->
  <g transform="translate(172, 166)" class="star-twinkle">
    <path d="M 0,-7 Q 0,0 7,0 Q 0,0 0,7 Q 0,0 -7,0 Q 0,0 0,-7 Z" fill="#38bdf8"/>
    <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Micro Stardust Particles -->
  <circle cx="68" cy="30" r="1.2" fill="#94a3b8" opacity="0.7"/>
  <circle cx="156" cy="24" r="1.5" fill="#cbd5e1" opacity="0.8"/>
  <circle cx="24" cy="95" r="1" fill="#94a3b8" opacity="0.6"/>
  <circle cx="198" cy="138" r="1.2" fill="#cbd5e1" opacity="0.7"/>
  <circle cx="82" cy="194" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="148" cy="198" r="1.2" fill="#818cf8" opacity="0.7"/>
</svg>