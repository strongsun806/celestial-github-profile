    <rect x="-5" y="-5" width="10" height="10" rx="3.5" fill="#38bdf8" filter="url(#neonSnakeGlow)">
      <animateMotion dur="18s" repeatCount="indefinite" begin="-0.12s">
        <mpath href="#snakePath"/>
      </animateMotion>
    </rect>

    <!-- Snake Head (Segment 1) with Glowing Core and Eye -->
    <g>
      <animateMotion dur="18s" repeatCount="indefinite" begin="0s">
        <mpath href="#snakePath"/>
      </animateMotion>
      <rect x="-5" y="-5" width="10" height="10" rx="3" fill="#ffffff" filter="url(#neonSnakeGlow)"/>
      <circle cx="0" cy="0" r="2" fill="#0284c7"/>
    </g>
