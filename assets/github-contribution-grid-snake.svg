    <g transform="translate(135, 45)" class="food1">
      <circle cx="5" cy="5" r="4.5" fill="#fbbf24" filter="url(#foodGlow)"/>
      <circle cx="5" cy="5" r="2" fill="#ffffff"/>
    </g>
    <g transform="translate(390, 30)" class="food2">
      <circle cx="5" cy="5" r="4.5" fill="#f43f5e" filter="url(#foodGlow)"/>
      <circle cx="5" cy="5" r="2" fill="#ffffff"/>
    </g>
    <g transform="translate(645, 45)" class="food3">
      <circle cx="5" cy="5" r="4.5" fill="#34d399" filter="url(#foodGlow)"/>
      <circle cx="5" cy="5" r="2" fill="#ffffff"/>
    </g>
    <g transform="translate(450, 15)" class="food4">
      <circle cx="5" cy="5" r="4.5" fill="#a855f7" filter="url(#foodGlow)"/>
      <circle cx="5" cy="5" r="2" fill="#ffffff"/>
    </g>

    <!-- ==================== NATURAL GRID-FOLLOWING NEON SNAKE ==================== -->
    <!-- Tail (Segment 5) -->
    <rect x="-5" y="-5" width="10" height="10" rx="3.5" fill="#0369a1" opacity="0.6">
      <animateMotion dur="18s" repeatCount="indefinite" begin="-0.48s">
        <mpath href="#snakePath"/>
      </animateMotion>
    </rect>

    <!-- Body Segment 4 -->
    <rect x="-5" y="-5" width="10" height="10" rx="3.5" fill="#0284c7" opacity="0.8">
      <animateMotion dur="18s" repeatCount="indefinite" begin="-0.36s">
        <mpath href="#snakePath"/>
      </animateMotion>
    </rect>

