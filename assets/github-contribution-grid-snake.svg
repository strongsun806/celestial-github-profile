<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 170" width="100%" height="100%">
  <defs>
    <linearGradient id="snakeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="neonSnakeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: "SFMono-Regular", Consolas, monospace; }
    .food-pulse { animation: foodPulse 1.2s ease-in-out infinite alternate; }
    .snake-head { animation: snakeMove 14s ease-in-out infinite alternate; }
    @keyframes foodPulse { 0% { opacity: 0.3; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1.1); } }
    @keyframes snakeMove {
      0%   { transform: translate(0, 0); }
      20%  { transform: translate(60px, -24px); }
      40%  { transform: translate(140px, 12px); }
      60%  { transform: translate(220px, -12px); }
      80%  { transform: translate(320px, 0px); }
      100% { transform: translate(420px, -24px); }
    }
  </style>

  <!-- Game Container Box -->
  <rect x="2" y="2" width="836" height="166" rx="12" fill="url(#snakeBg)" stroke="#1e293b" stroke-width="1.8"/>

  <!-- Top Status Bar -->
  <g transform="translate(20, 24)">
    <circle cx="6" cy="4" r="4" fill="#38bdf8"/>
    <text x="16" y="8" class="mono" font-size="11" font-weight="700" fill="#38bdf8">CONTRIBUTION SNAKE GAME // 60 FPS AUTO-PILOT</text>
    <text x="590" y="8" class="mono" font-size="10" fill="#94a3b8">SCORE: 1,420 • APPETITE: MAX</text>
  </g>

