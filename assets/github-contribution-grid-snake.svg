<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 170" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="snakeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <!-- Intense Neon Cyan & Amber Glow -->
    <filter id="neonSnakeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="foodGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Defined Natural Grid Movement Path (Strict 15px Grid Coordinates) -->
    <path id="snakePath" d="
      M 15,15
      L 135,15
      L 135,45
      L 255,45
      L 255,0
      L 390,0
      L 390,30
      L 510,30
      L 510,0
      L 645,0
      L 645,45
      L 765,45
      L 765,15
      L 690,15
      L 690,30
      L 585,30
      L 585,45
      L 450,45
      L 450,15
      L 330,15
      L 330,45
      L 195,45
      L 195,15
      L 75,15
      L 75,0
      L 15,0
      Z
    "/>
  </defs>

  <style>
    .mono { font-family: "SFMono-Regular", Consolas, monospace; }
    .food1 { animation: foodPulse 1.4s ease-in-out infinite alternate; }
    .food2 { animation: foodPulse 1.1s ease-in-out 0.4s infinite alternate; }
    .food3 { animation: foodPulse 1.6s ease-in-out 0.8s infinite alternate; }
    .food4 { animation: foodPulse 1.3s ease-in-out 0.2s infinite alternate; }

    @keyframes foodPulse {
      0%   { opacity: 0.35; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1.18); }
    }
  </style>

  <!-- Game Container Box -->
  <rect x="2" y="2" width="836" height="166" rx="12" fill="url(#snakeBg)" stroke="#1e293b" stroke-width="1.8"/>

  <!-- Top Status Bar -->
  <g transform="translate(20, 24)">
    <circle cx="6" cy="4" r="4.5" fill="#38bdf8" filter="url(#neonSnakeGlow)"/>
    <text x="18" y="8" class="mono" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">AUTONOMOUS NEON SNAKE // GRID-LOCKED KINEMATICS</text>
    <text x="560" y="8" class="mono" font-size="10" fill="#94a3b8">MODE: HUNTING • SPEED: 15px/step • FPS: 60</text>
  </g>

