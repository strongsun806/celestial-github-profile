<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 170" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="snakeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonSnakeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="foodGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Precise Tile-Center Snapped Movement Path (15*i+5, 15*j+5) -->
    <!-- Total Path Length: 1860px | Duration: 18.6s | Speed: 100px/s | 1 Tile (15px) = 0.15s -->
    <path id="snakePath" d="
      M 20,20
      L 140,20
      L 140,50
      L 260,50
      L 260,5
      L 410,5
      L 410,35
      L 530,35
      L 530,5
      L 665,5
      L 665,50
      L 770,50
      L 770,20
      L 695,20
      L 695,35
      L 575,35
      L 575,50
      L 455,50
      L 455,20
      L 335,20
      L 335,50
      L 185,50
      L 185,20
      L 80,20
      L 80,5
      L 20,5
      Z
    "/>
  </defs>

  <style>
    .mono { font-family: "SFMono-Regular", Consolas, monospace; }
    .food1 { animation: foodPulse 1.4s ease-in-out infinite alternate; }
    .food2 { animation: foodPulse 1.1s ease-in-out 0.4s infinite alternate; }
    .food3 { animation: foodPulse 1.6s ease-in-out 0.8s infinite alternate; }
    .food4 { animation: foodPulse 1.3s ease-in-out 0.2s infinite alternate; }

    @keyframes foodPulse {
      0%   { opacity: 0.35; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1.15); }
    }
  </style>

  <!-- Game Container Box -->
  <rect x="2" y="2" width="836" height="166" rx="12" fill="url(#snakeBg)" stroke="#1e293b" stroke-width="1.8"/>

  <!-- Top Status Bar -->
  <g transform="translate(20, 24)">
    <circle cx="6" cy="4" r="4.5" fill="#38bdf8" filter="url(#neonSnakeGlow)"/>
    <text x="18" y="8" class="mono" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">AUTONOMOUS NEON SNAKE // TILE-LOCKED ON-GRID KINEMATICS</text>
    <text x="560" y="8" class="mono" font-size="10" fill="#94a3b8">MODE: HUNTING • PITCH: 15px (1-TILE) • 60 FPS</text>
  </g>

