    <!-- Glowing Food Pellets (Centered on Specific Grid Tiles) -->
    <!-- Tile (x=140, y=50) -->
    <g transform="translate(140, 50)" class="food1">
      <circle cx="0" cy="0" r="4.5" fill="#fbbf24" filter="url(#foodGlow)"/>
      <circle cx="0" cy="0" r="2" fill="#ffffff"/>
    </g>
    <!-- Tile (x=410, y=35) -->
    <g transform="translate(410, 35)" class="food2">
      <circle cx="0" cy="0" r="4.5" fill="#f43f5e" filter="url(#foodGlow)"/>
      <circle cx="0" cy="0" r="2" fill="#ffffff"/>
    </g>
    <!-- Tile (x=665, y=5) -->
    <g transform="translate(665, 5)" class="food3">
      <circle cx="0" cy="0" r="4.5" fill="#34d399" filter="url(#foodGlow)"/>
      <circle cx="0" cy="0" r="2" fill="#ffffff"/>
    </g>
    <!-- Tile (x=455, y=20) -->
    <g transform="translate(455, 20)" class="food4">
      <circle cx="0" cy="0" r="4.5" fill="#a855f7" filter="url(#foodGlow)"/>
      <circle cx="0" cy="0" r="2" fill="#ffffff"/>
    </g>

    <!-- ==================== PERFECT ON-GRID NEON SNAKE ==================== -->
    <!-- Each segment is strictly snapped to the 10x10 tile bounds: x="-5" y="-5" width="10" height="10" -->
    <!-- Distance between segments = 15px (exactly 1 tile = 0.15s offset) -->

    <!-- Tail (Segment 5) -->
    <rect x="-5" y="-5" width="10" height="10" rx="2.5" fill="#0369a1" opacity="0.65">
      <animateMotion dur="18.6s" repeatCount="indefinite" begin="-0.60s">
        <mpath href="#snakePath"/>
      </animateMotion>
    </rect>

    <!-- Body Segment 4 -->
    <rect x="-5" y="-5" width="10" height="10" rx="2.5" fill="#0284c7" opacity="0.85">
      <animateMotion dur="18.6s" repeatCount="indefinite" begin="-0.45s">
        <mpath href="#snakePath"/>
      </animateMotion>
    </rect>

    <!-- Body Segment 3 -->
    <rect x="-5" y="-5" width="10" height="10" rx="2.5" fill="#0ea5e9" filter="url(#neonSnakeGlow)">
      <animateMotion dur="18.6s" repeatCount="indefinite" begin="-0.30s">
        <mpath href="#snakePath"/>
      </animateMotion>
    </rect>

    <!-- Body Segment 2 -->
    <rect x="-5" y="-5" width="10" height="10" rx="2.5" fill="#38bdf8" filter="url(#neonSnakeGlow)">
      <animateMotion dur="18.6s" repeatCount="indefinite" begin="-0.15s">
        <mpath href="#snakePath"/>
      </animateMotion>
    </rect>

    <!-- Snake Head (Segment 1) with Glowing Core and Eye -->
    <g>
      <animateMotion dur="18.6s" repeatCount="indefinite" begin="0s">
        <mpath href="#snakePath"/>
      </animateMotion>
      <rect x="-5" y="-5" width="10" height="10" rx="2.5" fill="#ffffff" filter="url(#neonSnakeGlow)"/>
      <circle cx="0" cy="0" r="2" fill="#0284c7"/>
    </g>
  </g>
</svg>