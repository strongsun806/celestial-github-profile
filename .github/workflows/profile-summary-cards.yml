name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 19 * * *" # Daily at 19:00 UTC (04:00 KST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-profile-summary-cards
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 9
          THEME: tokyonight # or solarized_dark, radical, dracula, github_dark
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git diff --staged --quiet || (git commit -m "chore: update profile summary cards" && git push)
